name: Refresh vacancy data

# Runs automatically on a schedule, and can also be triggered manually
# from the GitHub Actions tab. Runs on GitHub's own free cloud servers —
# no need to keep your own PC on. This works for Adzuna (unlike the old
# HeadHunter integration) because Adzuna is a commercial API designed for
# exactly this kind of automated, cloud-based access.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write   # needed to commit the updated database back to the repo

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the ETL pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRIES: "gb,us"
        run: python src/main.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.db
          git diff --cached --quiet || git commit -m "Auto-update vacancy data [skip ci]"
          git push
